# Actualiza cada semana los datos de «Dónde ver» (JustWatch vía TMDB) y de «Próximamente» (TMDB) y los sube al repositorio.
# Después prepara un resumen de la semana y, si hay algo relevante, lo publica como «issue»: GitHub lo manda por correo.
# Al subirse, Vercel vuelve a publicar la web sola.
# Necesita el secreto TMDB_API_TOKEN en GitHub: Settings → Secrets and variables → Actions.
name: Actualizar «Dónde ver» y «Próximamente»

on:
  schedule:
    - cron: '0 5 * * 1' # lunes a las 05:00 UTC
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      prueba:
        description: 'Mandar un aviso de prueba (para comprobar que llegan los correos)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Pedir los datos a TMDB
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          cp datos/proximamente.json "$RUNNER_TEMP/proximamente-anterior.json"
          python scripts/sincronizar_donde_ver.py
          python scripts/sincronizar_proximamente.py
      - name: Subir los cambios
        run: |
          if git diff --quiet -- datos/donde-ver.json datos/donde-ver-us.json datos/proximamente.json datos/novedades-plataformas.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/donde-ver.json datos/donde-ver-us.json datos/proximamente.json datos/novedades-plataformas.json
          git commit -m "Dónde ver y Próximamente: datos actualizados ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
      - name: Resumen semanal (aviso por correo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/resumen_semanal.py "$RUNNER_TEMP/proximamente-anterior.json" "$RUNNER_TEMP/resumen.md"
          if [ -f "$RUNNER_TEMP/resumen.md" ]; then
            gh issue create --title "Resumen semanal de Heroteca ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/resumen.md"
          fi
      - name: Aviso de prueba (solo si se pide al lanzarlo a mano)
        if: ${{ inputs.prueba }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Prueba de aviso de Heroteca" --body "Si te ha llegado este correo, los avisos semanales funcionan. Puedes cerrar este issue."

