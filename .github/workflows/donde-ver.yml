# Actualiza cada semana los datos de «Dónde ver» (JustWatch vía TMDB) y los sube al repositorio.
# Al subirse, Vercel vuelve a publicar la web sola.
# Necesita el secreto TMDB_API_TOKEN en GitHub: Settings → Secrets and variables → Actions.
name: Actualizar «Dónde ver»

on:
  schedule:
    - cron: '0 5 * * 1' # lunes a las 05:00 UTC
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Pedir los datos a TMDB
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python scripts/sincronizar_donde_ver.py
      - name: Subir los cambios
        run: |
          if git diff --quiet -- datos/donde-ver.json datos/donde-ver-us.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/donde-ver.json datos/donde-ver-us.json
          git commit -m "Dónde ver: datos actualizados ($(date -u +%Y-%m-%d))"
          git push
