# Recoge cada día los titulares de Marvel y DC de los RSS de medios especializados (scripts/sincronizar_noticias.py)
# y los sube al repositorio. Al subirse, Vercel vuelve a publicar la web sola. No necesita ninguna clave.
name: Actualizar «Noticias»

on:
  schedule:
    - cron: '30 6 * * *' # cada día a las 06:30 UTC
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recoger las noticias
        run: python scripts/sincronizar_noticias.py
      - name: Subir los cambios
        run: |
          if git diff --quiet -- datos/noticias.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/noticias.json
          git commit -m "Noticias: titulares actualizados ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
